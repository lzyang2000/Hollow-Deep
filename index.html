<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- No zooming, no double-tap, and the notch stays out of the way: the whole
     screen is game glass on a phone. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Hollow Deep — a roguelike descent</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="hint">WASD move &middot; mouse aim &middot; click attack &middot; SPACE ability &middot; E interact &middot; 1/2 potions &middot; I pack &middot; V zoom &middot; M mute &middot; ESC pause</div>

<!-- A run leaves the browser as a JSON file and comes back as one. Both are
     hidden controls the pause menu drives. -->
<a id="save-link" download hidden></a>
<input id="load-file" type="file" accept="application/json,.json" hidden>

<script src="js/00-namespace.js"></script>
